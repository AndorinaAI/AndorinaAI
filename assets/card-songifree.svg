  <rect class="bar" clip-path="url(#c)" x="1" y="1" width="418" height="4" fill="#1ed760" style="transform-origin:1px 1px"/>
  <g transform="translate(24 30)" color="#1ed760"><rect width="40" height="40" rx="10" fill="#1ed760" fill-opacity=".12"/><svg x="8" y="8" width="24" height="24" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></g>
  <text x="78" y="57" class="h">Songifree</text>
