<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Open Stream Suite">
  <style>
    .h{font:700 21px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#f0f6fc}
    .d{font:400 14.5px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#9ca3af}
    .tag{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e5e7eb}
    .st{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a970ff}
    .bar{animation:grow 1.2s ease-out both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <clipPath id="c"><rect x="1" y="1" width="418" height="198" rx="14"/></clipPath>
  <rect x="1" y="1" width="418" height="198" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect class="bar" clip-path="url(#c)" x="1" y="1" width="418" height="4" fill="#a970ff" style="transform-origin:1px 1px"/>
  <g transform="translate(24 30)" color="#a970ff"><rect width="40" height="40" rx="10" fill="#a970ff" fill-opacity=".12"/><svg x="8" y="8" width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="10.5" r="1.8" fill="currentColor"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><path d="M11 9h7M11 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></g>
  <text x="78" y="57" class="h">Open Stream Suite</text>
  <rect x="339" y="36" width="57" height="22" rx="11" fill="none" stroke="#a970ff" stroke-opacity=".6"/>
  <text x="367.5" y="51" text-anchor="middle" class="st">ALPHA</text>
  <text x="24" y="100" class="d">Overlays, alerts and widgets for Twitch</text><text x="24" y="122" class="d">and OBS Studio, with a local control panel.</text>
